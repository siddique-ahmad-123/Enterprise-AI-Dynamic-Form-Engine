services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - OPENAI_MODEL=gpt-4o
      - ENABLE_PHOENIX=true
      - PHOENIX_COLLECTOR_ENDPOINT=https://ainsg.newgensoftware.net/phoenix/v1/traces
      - ALLOWED_ORIGINS=*
      - DATABASE_URL=postgresql://admin:admin@postgres-db:5432/myapp?sslmode=prefer
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=myapp
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always

  copilot-runtime:
    build:
      context: ./copilot-runtime
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - PYTHON_COPILOT_URL=http://backend:8000/copilotkit
    depends_on:
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_COPILOTKIT_RUNTIME_URL=http://localhost:4000/copilotkit
      - VITE_BACKEND_URL=http://localhost:8000
      - BACKEND_PROXY=http://backend:8000
    depends_on:
      - copilot-runtime
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5055:80"
    depends_on:
      - postgres-db
    restart: always

volumes:
  postgres_data:


